name: Build Pixel Live Studio for Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check Python source
        run: python -m py_compile pixel_live_studio.py

      - name: Download portable FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg-release-essentials.zip
          if (!(Test-Path ffmpeg-release-essentials.zip)) { throw 'FFmpeg archive download failed.' }
          Expand-Archive -Path ffmpeg-release-essentials.zip -DestinationPath .ffmpeg_extract -Force
          $ffmpeg = Get-ChildItem .ffmpeg_extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem .ffmpeg_extract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'ffmpeg.exe or ffprobe.exe was not found in the archive.' }
          Copy-Item $ffmpeg.FullName 'ffmpeg/ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName 'ffmpeg/ffprobe.exe' -Force
          Remove-Item .ffmpeg_extract -Recurse -Force
          & 'ffmpeg/ffmpeg.exe' -version | Select-Object -First 1
          $encoders = (& 'ffmpeg/ffmpeg.exe' -hide_banner -encoders 2>&1 | Out-String)
          if ($encoders -notmatch 'libx264') { throw 'The bundled FFmpeg build does not expose the libx264 encoder required by this app.' }

      - name: Install packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name PixelLiveStudio `
            --add-binary 'ffmpeg/ffmpeg.exe;.' `
            --add-binary 'ffmpeg/ffprobe.exe;.' `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            pixel_live_studio.py
          if (!(Test-Path 'dist/PixelLiveStudio.exe')) { throw 'EXE build did not produce dist/PixelLiveStudio.exe' }
          $size = (Get-Item 'dist/PixelLiveStudio.exe').Length
          Write-Host "Built PixelLiveStudio.exe ($size bytes)"
          if ($size -lt 1000000) { throw 'EXE unexpectedly small; refusing to publish.' }
          Compress-Archive -Path 'dist/PixelLiveStudio.exe' -DestinationPath 'dist/PixelLiveStudio-Windows-x64.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: PixelLiveStudio-Windows-x64
          path: |
            dist/PixelLiveStudio.exe
            dist/PixelLiveStudio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pixel Live Studio Windows build ${{ github.run_number }}
          body: |
            Windows x64 standalone build generated by GitHub Actions.

            This is an MVP. Android Motion Photo container generation has been structurally checked, but Samsung Gallery and Douyin recognition still require real-device testing. Douyin recognition is not guaranteed until tested on the target phone/app version.
          files: |
            dist/PixelLiveStudio.exe
            dist/PixelLiveStudio-Windows-x64.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
